name: Build AryanVPN APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'
          cache: false

      - name: Install Android SDK and exact NDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.2.11394342"

          test -f "$ANDROID_HOME/ndk/26.2.11394342/source.properties"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.2.11394342" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.2.11394342" >> "$GITHUB_ENV"
          echo "NDK=$ANDROID_HOME/ndk/26.2.11394342" >> "$GITHUB_ENV"

      - name: Install build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y make git unzip python3

      - name: Check source integrity
        run: python3 scripts/check-source.py

      - name: Build sing-box libbox.aar
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.2.11394342"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export NDK="$ANDROID_NDK_HOME"

          echo "Using NDK: $ANDROID_NDK_HOME"
          test -f "$ANDROID_NDK_HOME/source.properties"

          git clone --depth 1 --branch v1.9.7 \
            https://github.com/SagerNet/sing-box.git \
            "$RUNNER_TEMP/sing-box"

          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

          chmod +x scripts/build-libbox.sh
          ./scripts/build-libbox.sh "$RUNNER_TEMP/sing-box"

      - name: Install Gradle
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"

          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"

          "$RUNNER_TEMP/gradle-8.7/bin/gradle" wrapper \
            --gradle-version 8.7

          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AryanVPN-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
